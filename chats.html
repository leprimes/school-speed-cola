<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis s</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #eaa866 0%, #a28b4b 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }
      .header {
        background: linear-gradient(135deg, #eaaf66 0%, #a2834b 100%);
        color: white;
        padding: 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header h1 {
        font-size: 24px;
        font-weight: 600;
      }
      .back-btn {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s;
      }
      .back-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }
      .s-container {
        padding: 20px;
        max-height: 70vh;
        overflow-y: auto;
      }
      .-item {
        display: flex;
        align-items: center;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.3s;
        border: 2px solid transparent;
        background: #f8f9fa;
      }
      .-item:hover {
        background: #e9ecef;
        border-color: #eaaa66;
        transform: translateX(5px);
      }
      .-avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
        margin-right: 15px;
        border: 3px solid #eabc66;
      }
      .-info {
        flex: 1;
        min-width: 0;
      }
      .-name {
        font-size: 18px;
        font-weight: 600;
        color: #2d3748;
        margin-bottom: 5px;
      }
      .-last-message {
        font-size: 14px;
        color: #718096;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
      }
      .-time {
        font-size: 12px;
        color: #a0aec0;
      }
      .no-s {
        text-align: center;
        padding: 60px 20px;
        color: #718096;
      }
      .no-s-icon {
        font-size: 64px;
        margin-bottom: 20px;
        opacity: 0.5;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: #718096;
      }
      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #eabc66;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>💬 Mis s</h1>
        <button class="back-btn" onclick="goBack()">← Volver</button>
      </div>

      <div class="s-container" id="sContainer">
        <div class="loading">
          <div class="spinner"></div>
          <p>Cargando s...</p>
        </div>
      </div>
    </div>

    <script>
      let currentUser = null;

      // Inicializar
      async function init() {
          try {
              // Verificar sesión
              const response = await fetch('/api/check-session', {
                  credentials: 'include'
              });
              const data = await response.json();

              if (!data.loggedIn) {
                  window.location.href = '/index.html';
                  return;
              }

              currentUser = data.user;
              console.log('Usuario actual:', currentUser);

              // Cargar s
              await loads();

          } catch (error) {
              console.error('Error inicializando:', error);
              showError('Error al cargar los s');
          }
      }

      // Cargar lista de s
      async function loads() {
          try {
              const isProvider = currentUser.isprovider === 1 || currentUser.isprovider === true;
              const endpoint = isProvider
                  ? `/api/s/provider/${currentUser.id}`
                  : `/api/s/client/${currentUser.id}`;

              console.log('Cargando s desde:', endpoint);

              const response = await fetch(endpoint, {
                  credentials: 'include'
              });

              if (!response.ok) throw new Error('Error al cargar s');

              const s = await response.json();
              console.log('s recibidos:', s);

              displays(s, isProvider);

          } catch (error) {
              console.error('Error cargando s:', error);
              showError('Error al cargar los s');
          }
      }

      // Mostrar s en la UI
      function displays(s, isProvider) {
          const container = document.getElementById('sContainer');

          if (s.length === 0) {
              container.innerHTML = `
                  <div class="no-s">
                      <div class="no-s-icon">💬</div>
                      <h3>No tienes s aún</h3>
                      <p>Los s aparecerán aquí cuando comiences una conversación</p>
                  </div>
              `;
              return;
          }

          container.innerHTML = s.map( => {
              const otherUser = isProvider
                  ? {
                      id: .idCliente,
                      nombre: .nombreCliente,
                      foto: .fotoCliente || 'https://via.placeholder.com/60'
                    }
                  : {
                      id: .idProveedor,
                      nombre: .nombreProveedor,
                      foto: .fotoProveedor || 'https://via.placeholder.com/60'
                    };

              const timeAgo = formatTimeAgo(.fechaUltimoMensaje);

              return `
                  <div class="-item" onclick="open(${otherUser.id})">
                      <img src="${otherUser.foto}" alt="${otherUser.nombre}" class="-avatar">
                      <div class="-info">
                          <div class="-name">${otherUser.nombre}</div>
                          <div class="-last-message">
                              ${.ultimoMensaje || 'Sin mensajes aún'}
                          </div>
                      </div>
                      <div class="-meta">
                          <div class="-time">${timeAgo}</div>
                      </div>
                  </div>
              `;
          }).join('');
      }

      // Abrir
      function open(otherUserId) {
          window.location.href = `/.html?to=${otherUserId}`;
      }

      // Formatear tiempo
      function formatTimeAgo(timestamp) {
          if (!timestamp) return '';

          const now = new Date();
          const time = new Date(timestamp);
          const diff = Math.floor((now - time) / 1000); // segundos

          if (diff < 60) return 'Ahora';
          if (diff < 3600) return `${Math.floor(diff / 60)}m`;
          if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
          if (diff < 604800) return `${Math.floor(diff / 86400)}d`;

          return time.toLocaleDateString('es', { day: 'numeric', month: 'short' });
      }

      // Mostrar error
      function showError(message) {
          const container = document.getElementById('sContainer');
          container.innerHTML = `
              <div class="no-s">
                  <div class="no-s-icon">⚠️</div>
                  <h3>Error</h3>
                  <p>${message}</p>
              </div>
          `;
      }

      // Volver atrás
      function goBack() {
          window.history.back();
      }

      // Iniciar cuando cargue la página
      window.onload = init;
    </script>
  </body>
</html>
